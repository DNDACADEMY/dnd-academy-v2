packages:
  - "apps/*"
  - "packages/*"
  - "__stubs__/*"

saveExact: true

overrides:
  webpack: "5.106.2"
  postcss: "8.5.28"
  "@babel/preset-env": "7.29.5"
  "@babel/plugin-transform-modules-systemjs": "7.29.4"
  "@babel/runtime": "7.29.2"
  "ajv@^8.0.0": "8.20.0"
  "ajv@^8.0.1": "8.20.0"
  "ajv@^8.9.0": "8.20.0"
  "ajv@^8.11.0": "8.20.0"
  "brace-expansion@^1.1.7": "1.1.14"
  "brace-expansion@^1.1.11": "1.1.14"
  "glob@^10.3.10": "10.5.0"
  ip-address: "10.2.0"
  "js-yaml@^3.13.1": "3.14.2"
  "js-yaml@^4.1.0": "4.1.1"
  node-gyp: "12.3.0"
  "picomatch@^2.0.4": "2.3.2"
  "picomatch@^2.2.1": "2.3.2"
  "picomatch@^2.2.3": "2.3.2"
  "picomatch@^2.3.1": "2.3.2"
  "yaml@^1.10.0": "1.10.3"
  canvas: "link:./__stubs__/canvas"
  node-polyfill-webpack-plugin: "link:./__stubs__/node-polyfill-webpack-plugin"
  axios: "^1.15.2"
  "@cypress/request>form-data": "^2.5.4"
  "@cypress/request>qs": "^6.14.2"

packageExtensions:
  "@oxc-resolver/binding-wasm32-wasi@*":
    dependencies:
      "@emnapi/core": "1.9.2"
      "@emnapi/runtime": "1.9.2"
  motion@*:
    dependencies:
      "@emotion/is-prop-valid": "1.4.0"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  cypress: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  core-js-pure: false
