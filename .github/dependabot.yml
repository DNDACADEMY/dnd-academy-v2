version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      # devDependencies는 메이저 포함 한 PR로 묶는다. 런타임 번들에 영향이
      # 없어 무더기로 열리는 것만 막으면 충분하다.
      development-dependencies:
        dependency-type: "development"
      # 런타임 의존성은 minor/patch만 묶는다. 메이저는 개별 PR로 남겨
      # (react-query 등) 동작 검증 후 단독 머지하도록 한다.
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Next와 @next 패키지는 호환성 검증 후 함께 수동으로 업데이트한다.
      - dependency-name: "next"
      - dependency-name: "@next/*"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Storybook과 Chromatic도 호환성 검증 후 함께 수동으로 업데이트한다.
      - dependency-name: "@storybook/*"
      - dependency-name: "storybook"
      - dependency-name: "@chromatic-com/storybook"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # PR #370 reverted react-pdf 10 after /projects/[id] crashed at runtime.
      # Verify the PDF worker and page navigation before updating this major.
      - dependency-name: "react-pdf"
        update-types: ["version-update:semver-major"]
      # Storybook uses the webpack version pinned in pnpm overrides.
      - dependency-name: "webpack"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
