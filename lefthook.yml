pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    eslint-web:
      root: "apps/web/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --fix --cache --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    eslint-admin:
      root: "apps/admin/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --fix --cache --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    eslint-ui:
      root: "packages/ui/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --fix --cache --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    eslint-core:
      root: "packages/core/"
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint --fix --cache --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,md,mdx,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    test-related:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm test:coverage -- --findRelatedTests {staged_files}
